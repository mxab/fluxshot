# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Built natively on the matching runner by .github/workflows/release.yml.
version: 2
project_name: fluxshot

builds:
  - builder: rust
    binary: fluxshot
    tool: cargo
    command: build
    flags: [--release]
    targets:
      - x86_64-pc-windows-msvc
    hooks:
      # Per-user setup.exe (Inno Setup), uploaded via the extra_files below.
      post: pwsh -NoProfile -File packaging/windows/build-installer.ps1 "{{ .Path }}" "{{ .Version }}" dist/windows-installer

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE-MIT, LICENSE-APACHE]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  split: true
  extra_files:
    - glob: dist/windows-installer/*.exe

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  disable: true

release:
  draft: true
  use_existing_draft: true
  name_template: "{{ .Tag }}"
  mode: keep-existing
  prerelease: auto
  extra_files:
    - glob: dist/windows-installer/*.exe
