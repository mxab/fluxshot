# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Built natively on the matching runner by .github/workflows/release.yml.
version: 2
project_name: fluxshot

builds:
  - id: fluxshot
    builder: rust
    binary: fluxshot
    tool: cargo
    command: build
    flags: [--release]
    targets:
      - aarch64-apple-darwin
      - x86_64-apple-darwin

# One arm64+x86_64 binary for FluxShot.app. The per-arch tarballs stay.
universal_binaries:
  - id: universal
    ids: [fluxshot]
    replace: false
    hooks:
      post: packaging/macos/build-app.sh "{{ .Path }}" "{{ .Version }}" dist/macos-app

archives:
  - id: cli
    ids: [fluxshot]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE-MIT, LICENSE-APACHE]

checksum:
  split: true
  extra_files:
    # FluxShot.app as DMG and zip (for the Homebrew cask), from the hook above.
    - glob: dist/macos-app/*

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

changelog:
  disable: true

release:
  draft: true
  use_existing_draft: true
  name_template: "{{ .Tag }}"
  mode: keep-existing
  prerelease: auto
  extra_files:
    # FluxShot.app as DMG and zip (for the Homebrew cask), from the hook above.
    - glob: dist/macos-app/*
