[package]
name = "fluxshot"
version = "0.3.0-rc1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
auto-launch = "0.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
global-hotkey = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify-rust = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
softbuffer = "0.4.8"
tiny-skia = "0.12.0"
toml = "1.2.2"
trash = "5.4.0"
winit = "0.30.13"
xcap = "0.9.10"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_HiDpi", "Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

# Pixel loops are painfully slow unoptimized; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
